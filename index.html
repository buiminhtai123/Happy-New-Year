<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Năm Mới 2026</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.8); z-index: 10; cursor: pointer; color: gold;
        }
        .instruction { font-size: 20px; border: 2px solid gold; padding: 10px 20px; border-radius: 30px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="overlay" onclick="startExperience()">
        <div class="instruction">Bấm vào đây để nhận quà Tết 🧧</div>
    </div>

    <audio id="music" loop>
        <source src="https://www.mboxdrive.com/tet-bin-an.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/geometries/TextGeometry.js"></script>

    <script>
        let scene, camera, renderer, textMesh, particles = [];
        const params = new URLSearchParams(window.location.search);
        const name = params.get("name") || "Em Bé";

        function startExperience() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('music').play();
            init();
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 45;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Ánh sáng lấp lánh
            const pointLight = new THREE.PointLight(0xffffff, 2);
            pointLight.position.set(20, 20, 20);
            scene.add(pointLight);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            // Chữ 3D
            const loader = new THREE.FontLoader();
            loader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', (font) => {
                const geometry = new THREE.TextGeometry(`Happy New Year\n2026, ${name}!`, {
                    font: font, size: 4, height: 1.5, curveSegments: 12,
                    bevelEnabled: true, bevelThickness: 0.5, bevelSize: 0.3
                });
                geometry.center();
                const material = new THREE.MeshPhongMaterial({ color: 0xffd700, shininess: 100, specular: 0xffffff });
                textMesh = new THREE.Mesh(geometry, material);
                scene.add(textMesh);
                animate();
            });

            setInterval(createFirework, 500);
        }

        function createFirework() {
            const geo = new THREE.BufferGeometry();
            const pos = [];
            for (let i = 0; i < 150; i++) {
                pos.push((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({ color: new THREE.Color(`hsl(${Math.random() * 360}, 100%, 60%)`), size: 0.4 });
            const p = new THREE.Points(geo, mat);
            p.position.set((Math.random() - 0.5) * 50, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 20);
            scene.add(p);
            particles.push({ mesh: p, life: 1.0 });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (textMesh) {
                textMesh.rotation.y += 0.01;
                textMesh.position.y = Math.sin(Date.now() * 0.002) * 2;
            }
            particles.forEach((p, i) => {
                p.mesh.scale.multiplyScalar(1.015);
                p.life -= 0.01;
                p.mesh.material.opacity = p.life;
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            });
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>

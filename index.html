<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chúc Mừng Năm Mới</title>

<style>
body {
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
    text-align:center;
    color:white;
}

#countdown {
    position:absolute;
    top:40%;
    width:100%;
    font-size:60px;
}

#message {
    position:absolute;
    top:30%;
    width:100%;
    font-size:50px;
    display:none;
}

canvas {
    position:fixed;
    top:0;
    left:0;
}
</style>
</head>
<body>

<div id="countdown"></div>
<div id="message"></div>

<audio id="music" src="https://cdn.pixabay.com/audio/2022/10/16/audio_12c6b81704.mp3"></audio>

<canvas id="fireworks"></canvas>

<script>
// ===== Lấy tên từ QR URL =====
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "Bạn";

// ===== Countdown đến giao thừa =====
const newYear = new Date("Jan 1, 2026 00:00:00").getTime();
const countdownEl = document.getElementById("countdown");
const messageEl = document.getElementById("message");
const music = document.getElementById("music");

const timer = setInterval(() => {
    const now = new Date().getTime();
    const diff = newYear - now;

    if (diff <= 0) {
        clearInterval(timer);
        startCelebration();
        return;
    }

    const s = Math.floor(diff / 1000) % 60;
    const m = Math.floor(diff / (1000*60)) % 60;
    const h = Math.floor(diff / (1000*60*60)) % 24;

    countdownEl.innerHTML = `⏳ ${h}h ${m}m ${s}s`;
}, 1000);

// ===== Khi đến giao thừa =====
function startCelebration(){
    countdownEl.style.display="none";
    messageEl.style.display="block";
    messageEl.innerHTML = `🎆 Chúc Mừng Năm Mới ${name}! 🎆`;

    music.play();
    launchFireworks();
}

// ===== Pháo hoa canvas =====
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function launchFireworks(){
    setInterval(()=>{
        createExplosion(
            Math.random()*canvas.width,
            Math.random()*canvas.height/2
        );
    },500);
}

function createExplosion(x,y){
    for(let i=0;i<100;i++){
        particles.push({
            x,y,
            angle: Math.random()*2*Math.PI,
            speed: Math.random()*5+2,
            life: 100
        });
    }
}

function animate(){
    requestAnimationFrame(animate);
    ctx.fillStyle="rgba(0,0,0,0.2)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    particles.forEach((p,i)=>{
        p.x += Math.cos(p.angle)*p.speed;
        p.y += Math.sin(p.angle)*p.speed;
        p.life--;

        ctx.beginPath();
        ctx.arc(p.x,p.y,2,0,Math.PI*2);
        ctx.fillStyle=`hsl(${Math.random()*360},100%,50%)`;
        ctx.fill();

        if(p.life<=0) particles.splice(i,1);
    });
}
animate();
</script>
</body>
</html>
